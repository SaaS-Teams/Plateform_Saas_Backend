# ==========================================
# PROFIL PRODUCTION
# ==========================================
# Toutes les valeurs sensibles sont injectées via des
# variables d'environnement. Aucun secret en dur.

# --- PostgreSQL ---
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true

# --- Redis ---
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# --- MongoDB ---
spring.data.mongodb.uri=${MONGO_URI}

# --- Elasticsearch ---
spring.elasticsearch.uris=${ELASTICSEARCH_URI}

# --- SendGrid / Email ---
spring.sendgrid.api-key=${SENDGRID_API_KEY}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}

# --- CORS / Frontend ---
app.frontend.url=${FRONTEND_URL}

# --- Swagger / OpenAPI ---
# Désactivé en production pour des raisons de sécurité
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- Actuator (monitoring) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=authorized

# --- Logs ---
logging.level.root=WARN
logging.level.tg.univlome.saas=INFO
logging.level.org.hibernate.SQL=WARN
