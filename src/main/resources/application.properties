spring.application.name=saas

# ==========================================
# CONFIGURATION COMMUNE
# ==========================================
server.port=8080

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saas_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- CORS / Frontend ---
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# --- Flyway ---
# Désactivé par défaut le temps d'avoir le premier script V1
spring.flyway.enabled=false

# --- SendGrid / Email ---
spring.sendgrid.api-key=${SENDGRID_API_KEY:}
spring.mail.default-encoding=UTF-8

# --- JWT ---
jwt.secret=${JWT_SECRET:}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=tg.univlome.saas
springdoc.paths-to-match=/**

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- CONFIGURATION RABBITMQ (Ajout du mode manuel) ---
# On passe en mode MANUEL pour pouvoir faire des NACK (requeue) en cas de Rate Limiting
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# --- CONFIGURATION RABBITMQ (Dead Letter Queue) ---
# Exchange et file dédiés aux messages en échec définitif (requeue=false)
saas.rabbitmq.dlx=automation-dlx
saas.rabbitmq.queue.dlq=workflow-step-dlq
saas.rabbitmq.routing-key.dlq=workflow.step.dead

# --- MongoDB (Automation, Analytics & Logs) ---
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DB:saas_nosql_db}
spring.data.mongodb.username=${MONGODB_USER:mongo_user}
spring.data.mongodb.password=${MONGODB_PASSWORD:mongo_password}

# --- Elasticsearch ---
spring.elasticsearch.uris=${ELASTICSEARCH_URI:http://localhost:9200}

# ==========================================
# QUARTZ SCHEDULER (Nœud WAIT persistant)
# ==========================================
# Utilise le store JDBC : les jobs survivent aux redémarrages du serveur
spring.quartz.job-store-type=jdbc
# Spring crée automatiquement les tables Quartz au démarrage si elles n'existent pas
spring.quartz.jdbc.initialize-schema=always
# L'instance démarre automatiquement avec l'application
spring.quartz.auto-startup=true
# Quartz utilise le même DataSource que Spring JPA (PostgreSQL)
spring.quartz.properties.org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
# Pool de threads Quartz
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.threadPool.threadPriority=5
# Nom unique de l'instance (utile si on passe en mode cluster plus tard)
spring.quartz.properties.org.quartz.scheduler.instanceName=SaasWorkflowScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# ==========================================
# SERVICE SMS (Fournisseur API REST)
# ==========================================
saas.sms.api-url=${SMS_API_URL:https://api.provider.com/v1/messages}
saas.sms.api-key=${SMS_API_KEY:}
saas.sms.sender-id=${SMS_SENDER_ID:SaaSPlatform}
