version: '3.8'

services:
  # --- 1. Base de données PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 2. Cache Redis & Rate Limiting ---
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 3. Broker RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: saas_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 4. MongoDB (Analytics & Event Logs) ---
  mongodb:
    image: mongo:7-jammy
    container_name: saas_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # --- 5. Microservice IA Python FastAPI ---
  backend-python:
    build:
      context: ../Plateform_Saas_AI_Predictive
      dockerfile: Dockerfile
    container_name: saas_ai_predictive_python
    restart: always
    ports:
      - "8000:8000"
    environment:
      API_PORT: 8000
      MODEL_VERSION: v1.0
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:your_mistral_api_key_here}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  # --- 6. Backend Monolithe Spring Boot Java ---
  backend-java:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_backend_java
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/saas_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/saas_analytics
      CRYPTO_SECRET_KEY: SaasMarketingSecretKeyForAES256Encryption2026!
      PYTHON_API_URL: http://backend-python:8000/api/v1/predict/lead-score
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      backend-python:
        condition: service_started

volumes:
  postgres_data:
  mongodb_data: